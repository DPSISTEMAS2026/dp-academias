[build]
  base = "client"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  VITE_BASE = "/"

# Enlaces viejos del path /academias → raíz del subdominio
[[redirects]]
  from = "/academias"
  to = "/"
  status = 301

[[redirects]]
  from = "/academias/*"
  to = "/:splat"
  status = 301

# Sin force: PNG/SVG/JS se sirven; el resto es la SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
