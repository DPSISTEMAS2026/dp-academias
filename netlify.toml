[build]
  base = "client"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  VITE_BASE = "/academias/"

# Si este sitio se publica en la raíz (otro Netlify) y el HTML pide /academias/...
[[redirects]]
  from = "/academias/assets/*"
  to = "/assets/:splat"
  status = 200

[[redirects]]
  from = "/academias/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
