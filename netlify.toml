[build]
  base = "client"
  command = "npm install && npm run build && mkdir -p dist-netlify/academias && cp -a dist/. dist-netlify/academias/"
  publish = "dist-netlify"

[build.environment]
  VITE_BASE = "/academias/"

# Vite pide /academias/...; el build queda en esa carpeta para que logos y mockups existan.
[[redirects]]
  from = "/"
  to = "/academias/"
  status = 302

# Sin force: si el archivo existe (png, svg, js) Netlify lo sirve; si no, es la SPA.
[[redirects]]
  from = "/academias/*"
  to = "/academias/index.html"
  status = 200
